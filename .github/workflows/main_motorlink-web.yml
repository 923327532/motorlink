# Despliegue del frontend (ASP.NET MVC) a Azure App Service "motorlink-web" con OIDC (sin contraseñas en el repositorio).
name: Build and deploy MotorLink.Web to Azure Web App - motorlink-web

on:
  push:
    branches:
      - 'main'
    paths:
      - 'frontend/MotorLink.Web/**'
      - '.github/workflows/main_motorlink-web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # necesario para actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build frontend/MotorLink.Web/MotorLink.Web.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish frontend/MotorLink.Web/MotorLink.Web.csproj -c Release -o publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # necesario para solicitar el JWT de OIDC
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_WEB_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_WEB_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_WEB_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'motorlink-web'
          slot-name: 'Production'
          package: .
